{% extends "base.html" %}
{% block title %}Reset Password — SafeRide AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-key text-info fs-1 mb-2"></i>
                    <h3 class="fw-bold text-white mb-1">Set New Password</h3>
                    <p class="text-white-50 small">Enter your new password below to reset your account credentials.</p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="new_password" class="form-label text-white-50 small fw-semibold">New Password</label>
                        <input type="password" id="new_password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Enter new password" autocomplete="new-password" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label text-white-50 small fw-semibold">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control bg-dark text-white border-secondary" placeholder="Re-enter new password" autocomplete="new-password" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-info w-100 fw-bold py-2 shadow-sm">
                        <i class="fa-solid fa-check-circle me-1"></i> Reset Password
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('auth.login') }}" class="text-info text-decoration-none small">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
