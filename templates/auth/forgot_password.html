{% extends "base.html" %}
{% block title %}Password Recovery — SafeRide AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5 text-center">
                <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-3">
                    <i class="fa-solid fa-key fs-1"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Reset Password</h3>
                <p class="text-muted small">Enter your registered email to receive password reset instructions</p>

                <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="mt-4">
                    <div class="mb-4 text-start">
                        <label for="email" class="form-label text-white-50 small fw-semibold">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="user@domain.com" autocomplete="email" required>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold">Send Recovery Link</button>
                </form>

                <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                    <a href="{{ url_for('auth.login') }}" class="text-info small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
